<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b5e20" />
    <meta name="description" content="Taji — réconciliation quotidienne pompes, cuves et caisse pour stations-service (Mali)." />
    <title>Taji — Gestion de stations-service</title>
    <script>
      // Thème : préférence enregistrée sinon système, sans flash au chargement.
      try {
        var pref = localStorage.getItem('taji-theme');
        var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = pref === 'dark' || ((pref === 'system' || !pref) && sysDark);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
