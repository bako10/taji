<script>
/* =====================================================================
   TAJI OFFLINE — couche hors-ligne
   - Lectures (GET) : mises en cache ; servies depuis le cache si le réseau tombe.
   - Écritures (POST/PATCH/DELETE) sans réseau : mises en file (IndexedDB) et
     rejouées automatiquement au retour du réseau, avec un jeton d'auth frais.
   - Les écritures qui exigent un retour serveur (onboarding : .select()) ne sont
     PAS mises en file (on ne peut pas inventer les identifiants) → erreur claire.
===================================================================== */
const TajiOffline = (() => {
  const origFetch = window.fetch.bind(window);
  const DB_NAME = 'taji-offline', DB_VER = 1;
  let dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('outbox')) d.createObjectStore('outbox', { keyPath: 'id', autoIncrement: true });
        if (!d.objectStoreNames.contains('cache'))  d.createObjectStore('cache',  { keyPath: 'url' });
        if (!d.objectStoreNames.contains('failed')) d.createObjectStore('failed', { keyPath: 'id', autoIncrement: true });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(store, mode, fn) {
    const d = await db();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode), s = t.objectStore(store);
      const out = fn(s);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  }
  const cachePut = (url, text) => tx('cache', 'readwrite', s => s.put({ url, text, ts: Date.now() })).catch(()=>{});
  const cacheGet = (url) => tx('cache', 'readonly', s => s.get(url)).then(r => r ? r.text : null).catch(()=>null);
  const outboxAdd = (rec) => tx('outbox', 'readwrite', s => s.add(rec));
  const outboxAll = () => tx('outbox', 'readonly', s => new Promise((res)=>{ const out=[]; s.openCursor().onsuccess=e=>{const c=e.target.result; if(c){out.push(c.value);c.continue();}else res(out);}; }));
  const outboxDel = (id) => tx('outbox', 'readwrite', s => s.delete(id));
  const failedAdd = (rec) => tx('failed', 'readwrite', s => s.add(rec)).catch(()=>{});
  async function pendingCount(){ try { return (await outboxAll()).length; } catch { return 0; } }

  function serializeHeaders(init) {
    const h = {}; const src = init && init.headers;
    if (!src) return h;
    if (typeof src.forEach === 'function' && !Array.isArray(src)) { src.forEach((v, k) => { h[k] = v; }); }
    else if (Array.isArray(src)) { src.forEach(([k, v]) => { h[k] = v; }); }
    else { Object.keys(src).forEach(k => { h[k] = src[k]; }); }
    delete h.Authorization; delete h.authorization; // rejeu avec un jeton frais
    return h;
  }
  const jsonResponse = (text, status) => new Response(text, { status, headers: { 'Content-Type': 'application/json' } });

  async function freshAuthHeaders(base) {
    const h = { ...base };
    try { const { data:{ session } } = await sb.auth.getSession(); if (session) h['Authorization'] = 'Bearer ' + session.access_token; } catch {}
    return h;
  }

  let replaying = false;
  async function replay() {
    if (replaying || !navigator.onLine) return;
    replaying = true;
    try {
      const items = await outboxAll();
      for (const it of items) {
        let res;
        try { res = await origFetch(it.url, { method: it.method, headers: await freshAuthHeaders(it.headers), body: it.body }); }
        catch { break; } // réseau reperdu → on réessaiera
        if (res.ok || res.status === 409) { await outboxDel(it.id); }          // succès (ou doublon déjà présent)
        else if (res.status >= 500) { break; }                                  // erreur serveur → réessai plus tard
        else { await failedAdd({ ...it, failStatus: res.status, failAt: Date.now() }); await outboxDel(it.id); } // 4xx définitif
      }
    } catch {} finally { replaying = false; updateBanner(); }
  }

  async function tajiFetch(input, init) {
    const url = typeof input === 'string' ? input : input.url;
    const method = ((init && init.method) || (typeof input !== 'string' && input.method) || 'GET').toUpperCase();
    const isRest = url.includes('/rest/v1/');
    try {
      const res = await origFetch(input, init);
      if (isRest && method === 'GET' && res.ok) { res.clone().text().then(t => cachePut(url, t)); }
      if (navigator.onLine) replay();
      return res;
    } catch (netErr) {
      if (!isRest) throw netErr; // auth & autres : laisser remonter
      if (method === 'GET') {
        const cached = await cacheGet(url);
        return jsonResponse(cached != null ? cached : '[]', 200); // sinon liste vide → l'app s'affiche
      }
      // Mutation hors-ligne
      const prefer = ((init && init.headers && (init.headers.Prefer || init.headers.prefer)) || '');
      const wantsRepresentation = /return=representation/.test(prefer) || /[?&]select=/.test(url);
      if (wantsRepresentation) throw netErr; // besoin des ids serveur (onboarding) → erreur claire
      await outboxAdd({ url, method, headers: serializeHeaders(init), body: (init && init.body) || null, ts: Date.now() });
      updateBanner();
      toast('📴 Hors-ligne — saisie gardée sur l\'appareil');
      return jsonResponse('[]', method === 'DELETE' ? 204 : 201); // succès optimiste (PostgREST renvoie [] sans representation)
    }
  }

  async function updateBanner() {
    let bar = document.getElementById('offbar');
    const n = await pendingCount();
    const offline = !navigator.onLine;
    if (!offline && n === 0) { if (bar) bar.remove(); return; }
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'offbar';
      bar.style.cssText = 'position:sticky;top:0;z-index:100;padding:6px 12px;font-size:12.5px;font-weight:600;text-align:center;color:#fff';
      const app = document.querySelector('.app') || document.body;
      app.insertBefore(bar, app.firstChild);
    }
    if (offline) { bar.style.background = '#b26a00'; bar.textContent = `📴 Hors-ligne — saisies gardées sur l'appareil${n ? ` · ${n} en attente` : ''}`; }
    else { bar.style.background = '#1b5e20'; bar.textContent = `⟳ Synchronisation… ${n} saisie(s) en attente`; }
  }

  function init() {
    window.addEventListener('online',  () => { toast('🌐 De retour en ligne — synchronisation…'); updateBanner(); replay(); });
    window.addEventListener('offline', () => { toast('📴 Hors-ligne'); updateBanner(); });
    setInterval(() => { if (navigator.onLine) replay(); }, 30000); // filet de sécurité
    updateBanner();
    if (navigator.onLine) replay();
  }

  return { fetch: tajiFetch, replay, pendingCount, updateBanner, init };
})();

/* =====================================================================
   TAJI — application de gestion de stations-service (Mali)
   Front-end vanilla JS + Supabase
===================================================================== */
const SUPABASE_URL = 'https://ayvmfcttcondxvfpdiok.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WEoGK95LS8IXeNoZyV9Sng_Vnjukyd-';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { global: { fetch: TajiOffline.fetch } });
window.sb = sb;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const fmt  = n => Math.round(+n||0).toLocaleString('fr-FR');
const fmtS = n => ((+n)>0?'+':(+n)<0?'−':'') + fmt(Math.abs(+n||0));
const todayISO = () => new Date().toISOString().slice(0,10);
const frDate = iso => new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const frDateShort = iso => new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
const addDays = (iso,n) => { const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PRODUITS = {essence:'Essence', gasoil:'Gasoil', petrole:'Pétrole lampant', melange:'Mélange'};
const METHODES = {especes:'💵 Espèces', orange_money:'🟠 Orange Money', moov_money:'🔵 Moov Money', credit:'📒 Crédit client'};
const EXP_CATS = {salaire:'Salaire', maintenance:'Maintenance', electricite:'Électricité', transport:'Transport', taxe:'Taxe', carburant:'Carburant', autre:'Autre'};
const CHIP = {
  ok:'<span class="chip ok">✔ Conforme</span>',
  warn:'<span class="chip warn">⚠ À surveiller</span>',
  crit:'<span class="chip crit">✖ Écart important</span>',
  wait:'<span class="chip wait">⏳ En attente</span>'
};
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',ms); }
function err(e){ console.error(e); toast('⚠ ' + (e?.message || e || 'Erreur inattendue'), 4000); }
async function safe(promise){ const {data,error} = await promise; if(error) throw error; return data; }

/* ---------- état global ---------- */
const S = {
  session:null, user:null, profile:null,
  orgs:[], stations:[], memberships:[], prices:[],
  isOwner:false, isGerant:false,
  tab:'accueil', day: todayISO(), gerStation:null,
  cache:{}
};
function latestPrice(orgId, product, day){
  const rows = S.prices.filter(p=>p.org_id===orgId && p.product===product && p.effective_date<= (day||todayISO()));
  rows.sort((a,b)=> a.effective_date<b.effective_date?1:-1);
  return rows[0]?.price_fcfa ?? null;
}
/* Dernier prix d'achat connu (ignore les lignes sans prix d'achat) — pour la marge */
function latestBuyPrice(orgId, product, day){
  const rows = S.prices.filter(p=>p.org_id===orgId && p.product===product && p.effective_date<=(day||todayISO()) && p.buy_price_fcfa!=null);
  rows.sort((a,b)=> a.effective_date<b.effective_date?1:-1);
  return rows[0]?.buy_price_fcfa ?? null;
}
function orgOf(station){ return S.orgs.find(o=>o.id===station.org_id); }
function myStations(){
  if(S.isOwner) return S.stations.filter(st=> S.orgs.some(o=>o.id===st.org_id && o.owner_id===S.user.id) && st.active);
  return S.stations.filter(st=> S.memberships.some(m=>m.station_id===st.id) && st.active);
}

/* ---------- chargement du contexte ---------- */
async function loadContext(){
  const uid = S.user.id;
  const [profile, orgs, stations, memberships, prices] = await Promise.all([
    safe(sb.from('profiles').select('*').eq('id', uid).maybeSingle()),
    safe(sb.from('organizations').select('*')),
    safe(sb.from('stations').select('*').order('created_at')),
    safe(sb.from('station_members').select('*').eq('user_id', uid).eq('active', true)),
    safe(sb.from('prices').select('*'))
  ]);
  S.profile = profile; S.orgs = orgs; S.stations = stations;
  S.memberships = memberships; S.prices = prices;
  S.isOwner = orgs.some(o=>o.owner_id===uid);
  S.isGerant = memberships.length>0;
}

/* ---------- démarrage ---------- */
async function boot(){
  try{
    const { data:{session} } = await sb.auth.getSession();
    S.session = session; S.user = session?.user || null;
    if(!S.user){ renderAuth(); }
    else{
      await loadContext();
      if(!S.isOwner && !S.isGerant) renderChooseRole();
      else renderApp();
    }
  }catch(e){ err(e); renderAuth(); }
  $('#loader').style.display='none';
}
sb.auth.onAuthStateChange((_e, session)=>{ S.session=session; S.user=session?.user||null; });

/* =====================================================================
   AUTHENTIFICATION
===================================================================== */
function authShell(inner){
  $('#topbar').classList.add('hidden'); $('#tabbar').classList.add('hidden');
  $('#main').innerHTML = `
    <div class="auth-hero"><div class="logo">⛽</div><h1>Taji</h1>
      <p>La gestion claire de vos stations-service.<br>Pompes · Cuves · Caisse · Écarts</p></div>
    <div class="card" style="margin-top:14px">${inner}</div>`;
}
function renderAuth(mode='login'){
  if(mode==='login'){
    authShell(`
      <div class="fld"><label>Adresse email</label><input id="a_email" type="email" autocomplete="email" placeholder="vous@exemple.com"></div>
      <div class="fld"><label>Mot de passe</label><input id="a_pass" type="password" autocomplete="current-password"></div>
      <button class="btn" onclick="doLogin()">Se connecter</button>
      <div class="switch-auth">Pas encore de compte ? <button class="link" onclick="renderAuth('signup')">Créer un compte</button></div>`);
  } else {
    authShell(`
      <div class="fld"><label>Nom complet</label><input id="a_name" placeholder="Prénom Nom"></div>
      <div class="fld"><label>Téléphone</label><input id="a_phone" type="tel" placeholder="+223 …"></div>
      <div class="fld"><label>Adresse email</label><input id="a_email" type="email" autocomplete="email"></div>
      <div class="fld"><label>Mot de passe (8 caractères min.)</label><input id="a_pass" type="password" autocomplete="new-password"></div>
      <button class="btn" onclick="doSignup()">Créer mon compte</button>
      <div class="switch-auth">Déjà un compte ? <button class="link" onclick="renderAuth('login')">Se connecter</button></div>`);
  }
}
async function doLogin(){
  try{
    const {error} = await sb.auth.signInWithPassword({email:$('#a_email').value.trim(), password:$('#a_pass').value});
    if(error) throw error;
    $('#loader').style.display='flex'; await boot();
  }catch(e){ err(e); }
}
async function doSignup(){
  try{
    const name=$('#a_name').value.trim(); if(!name) return toast('Indique ton nom complet');
    const {data,error} = await sb.auth.signUp({
      email:$('#a_email').value.trim(), password:$('#a_pass').value,
      options:{ data:{ full_name:name, phone:$('#a_phone').value.trim() } }
    });
    if(error) throw error;
    if(!data.session){ toast('Compte créé — vérifie ta boîte mail pour confirmer.'); renderAuth('login'); return; }
    $('#loader').style.display='flex'; await boot();
  }catch(e){ err(e); }
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }

/* =====================================================================
   PREMIÈRE CONNEXION — choix du rôle
===================================================================== */
function renderChooseRole(){
  authShell(`
    <p style="font-size:14px;margin-bottom:12px"><b>Bienvenue ${esc(S.profile?.full_name||'')} !</b><br>Comment veux-tu utiliser Taji ?</p>
    <button class="btn" onclick="renderOnboarding()">👔 Je suis propriétaire — créer mes stations</button>
    <button class="btn ghost" onclick="renderJoin()">🧑‍🔧 Je suis gérant — j'ai un code d'invitation</button>
    <div class="switch-auth"><button class="link" onclick="doLogout()">Se déconnecter</button></div>`);
}
function renderJoin(){
  authShell(`
    <p style="font-size:14px;margin-bottom:10px"><b>Rejoindre une station</b><br>Saisis le code que ton propriétaire t'a transmis.</p>
    <div class="fld"><label>Code d'invitation</label><input id="j_code" style="text-transform:uppercase;letter-spacing:3px;font-weight:700" placeholder="EX: TJ4K9P"></div>
    <button class="btn" onclick="doJoin()">Rejoindre la station</button>
    <div class="switch-auth"><button class="link" onclick="renderChooseRole()">‹ Retour</button></div>`);
}
async function doJoin(){
  try{
    const res = await safe(sb.rpc('join_with_invite', {p_code: $('#j_code').value}));
    if(!res.ok) return toast('⚠ ' + res.error);
    toast('✔ Station rejointe : ' + res.station_name);
    $('#loader').style.display='flex'; await loadContext(); renderApp();
    $('#loader').style.display='none';
  }catch(e){ err(e); }
}

/* =====================================================================
   ONBOARDING PROPRIÉTAIRE — org, station, cuves, pistolets, prix
===================================================================== */
const OB = { org:'', st:{name:'',city:''}, tanks:[], nozzles:[], prices:{essence:'',gasoil:''} };
function renderOnboarding(step=1){
  const steps = {
    1: `<p style="font-size:14px;margin-bottom:10px"><b>Étape 1/4 — Ton entreprise</b></p>
        <div class="fld"><label>Nom de l'entreprise / du réseau</label><input id="ob_org" value="${esc(OB.org)}" placeholder="Ex : Sangaré Distribution"></div>
        <button class="btn" onclick="OB.org=$('#ob_org').value.trim(); if(!OB.org) return toast('Nom requis'); renderOnboarding(2)">Continuer</button>`,
    2: `<p style="font-size:14px;margin-bottom:10px"><b>Étape 2/4 — Ta première station</b><br><span style="color:var(--ink3);font-size:12px">Tu pourras en ajouter d'autres dans Réglages.</span></p>
        <div class="fld"><label>Nom de la station</label><input id="ob_stname" value="${esc(OB.st.name)}" placeholder="Ex : Station Faladié"></div>
        <div class="fld"><label>Ville / quartier</label><input id="ob_stcity" value="${esc(OB.st.city)}" placeholder="Ex : Bamako — Faladié"></div>
        <button class="btn" onclick="OB.st={name:$('#ob_stname').value.trim(),city:$('#ob_stcity').value.trim()}; if(!OB.st.name) return toast('Nom requis'); renderOnboarding(3)">Continuer</button>`,
    3: `<p style="font-size:14px;margin-bottom:10px"><b>Étape 3/4 — Cuves et pistolets</b></p>
        <div id="ob_tanks">${OB.tanks.map((t,i)=>`
          <div class="pumphead">🛢 ${esc(t.name)} — ${PRODUITS[t.product]} · ${fmt(t.capacity)} L · stock actuel ${fmt(t.stock)} L
            <button class="link" style="float:right;color:var(--crit)" onclick="OB.tanks.splice(${i},1);renderOnboarding(3)">retirer</button></div>
          ${OB.nozzles.filter(n=>n.tank===i).map(n=>`<div style="font-size:12.5px;color:var(--ink2);padding-left:10px">⛽ ${esc(n.name)} — index actuel ${fmt(n.index)}</div>`).join('')}`).join('') || '<p style="font-size:13px;color:var(--ink3)">Aucune cuve pour le moment.</p>'}</div>
        <div class="card" style="background:var(--page);margin-top:10px">
          <b style="font-size:13px">Ajouter une cuve</b>
          <div class="grid2" style="margin-top:8px">
            <div class="fld"><label>Produit</label><select id="ob_tp"><option value="essence">Essence</option><option value="gasoil">Gasoil</option><option value="petrole">Pétrole</option><option value="melange">Mélange</option></select></div>
            <div class="fld"><label>Nom</label><input id="ob_tn" placeholder="Cuve 1"></div>
            <div class="fld"><label>Capacité (L)</label><input id="ob_tc" type="number" inputmode="numeric" placeholder="20000"></div>
            <div class="fld"><label>Stock actuel (L)</label><input id="ob_ts" type="number" inputmode="numeric" placeholder="12000"></div>
          </div>
          <button class="btn ghost small" onclick="obAddTank()">+ Ajouter la cuve</button>
        </div>
        ${OB.tanks.length? `<div class="card" style="background:var(--page)">
          <b style="font-size:13px">Ajouter un pistolet</b>
          <div class="grid2" style="margin-top:8px">
            <div class="fld"><label>Cuve</label><select id="ob_nt">${OB.tanks.map((t,i)=>`<option value="${i}">${esc(t.name)} (${PRODUITS[t.product]})</option>`).join('')}</select></div>
            <div class="fld"><label>Nom</label><input id="ob_nn" placeholder="Pompe 1 · Pistolet A"></div>
          </div>
          <div class="fld"><label>Index actuel du compteur</label><input id="ob_ni" type="number" inputmode="numeric" placeholder="1583240"><div class="hint">le chiffre affiché sur la pompe aujourd'hui</div></div>
          <button class="btn ghost small" onclick="obAddNozzle()">+ Ajouter le pistolet</button>
        </div>`:''}
        <button class="btn" onclick="if(!OB.tanks.length||!OB.nozzles.length) return toast('Ajoute au moins une cuve et un pistolet'); renderOnboarding(4)">Continuer</button>`,
    4: `<p style="font-size:14px;margin-bottom:10px"><b>Étape 4/4 — Prix à la pompe (FCFA / litre)</b></p>
        ${[...new Set(OB.tanks.map(t=>t.product))].map(p=>`
          <div class="fld"><label>${PRODUITS[p]}</label><input id="ob_px_${p}" type="number" inputmode="numeric" value="${OB.prices[p]||''}" placeholder="850"></div>`).join('')}
        <button class="btn" onclick="obFinish()">🚀 Créer ma station</button>`
  };
  authShell(steps[step] + `<div class="switch-auth"><button class="link" onclick="${step>1?`renderOnboarding(${step-1})`:'renderChooseRole()'}">‹ Retour</button></div>`);
}
function obAddTank(){
  const t={product:$('#ob_tp').value, name:$('#ob_tn').value.trim()||('Cuve '+(OB.tanks.length+1)), capacity:+$('#ob_tc').value, stock:+$('#ob_ts').value||0};
  if(!(t.capacity>0)) return toast('Capacité requise');
  OB.tanks.push(t); renderOnboarding(3);
}
function obAddNozzle(){
  const n={tank:+$('#ob_nt').value, name:$('#ob_nn').value.trim()||('Pistolet '+(OB.nozzles.length+1)), index:+$('#ob_ni').value||0};
  OB.nozzles.push(n); renderOnboarding(3);
}
async function obFinish(){
  try{
    $('#loader').style.display='flex';
    const org = await safe(sb.from('organizations').insert({name:OB.org, owner_id:S.user.id}).select().single());
    const st = await safe(sb.from('stations').insert({org_id:org.id, name:OB.st.name, city:OB.st.city}).select().single());
    const tankRows = await safe(sb.from('tanks').insert(OB.tanks.map(t=>({station_id:st.id, product:t.product, name:t.name, capacity_l:t.capacity, initial_stock_l:t.stock}))).select());
    await safe(sb.from('nozzles').insert(OB.nozzles.map(n=>({station_id:st.id, tank_id:tankRows[n.tank].id, name:n.name, initial_index:n.index}))));
    const priceRows = [];
    [...new Set(OB.tanks.map(t=>t.product))].forEach(p=>{
      const v = +document.getElementById('ob_px_'+p)?.value || +OB.prices[p];
      if(v>0) priceRows.push({org_id:org.id, product:p, price_fcfa:v, created_by:S.user.id});
    });
    if(priceRows.length) await safe(sb.from('prices').insert(priceRows));
    await loadContext(); S.tab='accueil'; renderApp();
  }catch(e){ err(e); }
  $('#loader').style.display='none';
}

/* =====================================================================
   COQUILLE PRINCIPALE + NAVIGATION
===================================================================== */
function renderApp(){
  $('#topbar').classList.remove('hidden'); $('#tabbar').classList.remove('hidden');
  $('#topmeta').innerHTML = `${esc(S.profile?.full_name||'')}<br><span style="color:var(--brand);font-weight:700">${S.isOwner?'Propriétaire':'Gérant'}</span>`;
  const tabs = S.isOwner
    ? [['accueil','🏠','Accueil'],['saisie','📝','Saisie'],['credits','📒','Crédits'],['rapports','📊','Rapports'],['reglages','⚙️','Réglages']]
    : [['saisie','📝','Saisie'],['historique','🗓','Historique'],['credits','📒','Crédits'],['equipe','👥','Équipe'],['reglages','⚙️','Réglages']];
  $('#tabs').innerHTML = tabs.map(([id,ic,lb])=>`<button class="${S.tab===id?'active':''}" onclick="goTab('${id}')"><span class="ic">${ic}</span>${lb}</button>`).join('');
  const views = {accueil:renderAccueil, saisie:renderSaisie, credits:renderCredits, rapports:renderRapports, reglages:renderReglages, historique:renderHistorique, equipe:renderEquipe};
  (views[S.tab] || (S.isOwner?renderAccueil:renderSaisie))();
}
function goTab(t){ S.tab=t; renderApp(); }
</script>
<script>
/* =====================================================================
   DONNÉES MÉTIER — chargements et calculs
===================================================================== */
async function loadInfra(stId){
  if(S.cache['infra_'+stId]) return S.cache['infra_'+stId];
  const [tanks, nozzles] = await Promise.all([
    safe(sb.from('tanks').select('*').eq('station_id',stId).eq('active',true).order('created_at')),
    safe(sb.from('nozzles').select('*').eq('station_id',stId).eq('active',true).order('created_at'))
  ]);
  const infra = {tanks, nozzles};
  S.cache['infra_'+stId] = infra;
  return infra;
}
async function loadDay(stId, day){
  const [readings, dips, deliveries, cash, expenses, closure] = await Promise.all([
    safe(sb.from('nozzle_readings').select('*').eq('station_id',stId).eq('day',day)),
    safe(sb.from('tank_dips').select('*').eq('station_id',stId).eq('day',day)),
    safe(sb.from('deliveries').select('*').eq('station_id',stId).eq('day',day).order('created_at')),
    safe(sb.from('cash_entries').select('*').eq('station_id',stId).eq('day',day).order('created_at')),
    safe(sb.from('expenses').select('*').eq('station_id',stId).eq('day',day).order('created_at')),
    safe(sb.from('day_closures').select('*').eq('station_id',stId).eq('day',day).maybeSingle())
  ]);
  return {readings, dips, deliveries, cash, expenses, closure};
}
async function lastClosingIndexes(stId, day, nozzles){
  const since = addDays(day,-60);
  const rows = await safe(sb.from('nozzle_readings').select('nozzle_id,day,closing_index')
    .eq('station_id',stId).lt('day',day).gte('day',since).not('closing_index','is',null)
    .order('day',{ascending:false}));
  const map = {};
  nozzles.forEach(n=>{
    const r = rows.find(x=>x.nozzle_id===n.id);
    map[n.id] = r ? +r.closing_index : +n.initial_index;
  });
  return map;
}
async function tankBaseline(stId, day, tanks){
  const since = addDays(day,-60);
  const dipRows = await safe(sb.from('tank_dips').select('tank_id,day,dip_l')
    .eq('station_id',stId).lt('day',day).gte('day',since).order('day',{ascending:false}));
  const map = {};
  for(const t of tanks){
    const r = dipRows.find(x=>x.tank_id===t.id);
    map[t.id] = r ? {stock:+r.dip_l, sinceDay:r.day} : {stock:+t.initial_stock_l, sinceDay:null};
  }
  return map;
}
/* Calcul complet d'une journée (retourne null si relevés incomplets) */
async function computeDay(st, day, dayData, infra){
  const {tanks, nozzles} = infra;
  const {readings, dips, deliveries, cash} = dayData;
  const openMap = await lastClosingIndexes(st.id, day, nozzles);
  const base = await tankBaseline(st.id, day, tanks);

  const readingsOk = nozzles.length>0 && nozzles.every(n=> readings.some(r=>r.nozzle_id===n.id && r.closing_index!=null));
  const dipsOk = tanks.length>0 && tanks.every(t=> dips.some(d=>d.tank_id===t.id));
  const cashOk = cash.length>0;

  // ventes par cuve/produit
  const parCuve = {};
  tanks.forEach(t=> parCuve[t.id] = {tank:t, ventes:0});
  const parPompiste = {};
  nozzles.forEach(n=>{
    const r = readings.find(x=>x.nozzle_id===n.id);
    if(!r || r.closing_index==null) return;
    const v = Math.max(0, +r.closing_index - +r.opening_index);
    if(parCuve[n.tank_id]) parCuve[n.tank_id].ventes += v;
    if(r.staff_id){ parPompiste[r.staff_id] = (parPompiste[r.staff_id]||0) + v; }
  });
  // besoin des ventes intermédiaires entre le dernier jaugeage et ce jour (si trou de plusieurs jours)
  let ventesL=0, caTheo=0, ecartCuve=0, margeBrute=0, margeDispo=false;
  const lignes = [];
  const org = orgOf(st);
  for(const t of tanks){
    const ventes = parCuve[t.id].ventes;
    const prix = latestPrice(org.id, t.product, day) || 0;
    const prixAchat = latestBuyPrice(org.id, t.product, day);
    const livraisons = deliveries.filter(d=>d.tank_id===t.id)
      .reduce((s,d)=> s + (+d.volume_received_l ?? +d.volume_invoiced_l), 0);
    // ventes + livraisons entre baseline et hier (jours intermédiaires non jaugés)
    let interVentes=0, interLivr=0;
    const b = base[t.id];
    if(b.sinceDay !== null && addDays(b.sinceDay,1) < day){
      const nozzleIds = nozzles.filter(n=>n.tank_id===t.id).map(n=>n.id);
      const [interReads, interDeliv] = await Promise.all([
        safe(sb.from('nozzle_readings').select('nozzle_id,opening_index,closing_index')
          .eq('station_id',st.id).gt('day',b.sinceDay).lt('day',day).in('nozzle_id',nozzleIds)),
        safe(sb.from('deliveries').select('tank_id,volume_received_l,volume_invoiced_l')
          .eq('station_id',st.id).gt('day',b.sinceDay).lt('day',day).eq('tank_id',t.id))
      ]);
      interVentes = interReads.reduce((s,r)=> s + Math.max(0,(+r.closing_index||0)-(+r.opening_index||0)),0);
      interLivr = interDeliv.reduce((s,d)=> s + (+d.volume_received_l ?? +d.volume_invoiced_l),0);
    }
    const stockAttendu = b.stock + interLivr - interVentes + livraisons - ventes;
    const dipRow = dips.find(d=>d.tank_id===t.id);
    const jauge = dipRow ? +dipRow.dip_l : null;
    const ec = (jauge!==null) ? (jauge - stockAttendu) : 0;
    const margeLigne = (prixAchat!=null) ? ventes*(prix - prixAchat) : null;
    if(margeLigne!=null){ margeBrute += margeLigne; margeDispo = true; }
    ventesL += ventes; caTheo += ventes*prix; ecartCuve += ec;
    lignes.push({tank:t, produit:PRODUITS[t.product], ventes, prix, prixAchat, marge:margeLigne, ca:ventes*prix,
                 stockAttendu, jauge, ecart:ec, livraisons});
  }
  const enc = cash.reduce((s,c)=> s + (+c.amount_fcfa||0), 0);
  const encParMode = {};
  cash.forEach(c=>{ encParMode[c.method]=(encParMode[c.method]||0)+(+c.amount_fcfa||0); });
  const ecartCaisse = enc - caTheo;
  const depenses = (dayData.expenses||[]).reduce((s,e)=> s + (+e.amount_fcfa||0), 0);
  const margeNette = margeDispo ? (margeBrute - depenses) : null;
  return {ventesL, caTheo, enc, encParMode, ecartCaisse, ecartCuve, lignes, parPompiste,
          margeBrute: margeDispo?margeBrute:null, depenses, margeNette, margeDispo,
          readingsOk, dipsOk, cashOk, complet: readingsOk && dipsOk};
}
function statutOf(c){
  const pc = c.caTheo ? Math.abs(c.ecartCaisse)/c.caTheo : 0;
  const pv = c.ventesL ? Math.abs(c.ecartCuve)/c.ventesL : 0;
  if(pc<=0.005 && pv<=0.005) return 'ok';
  if(pc<=0.015 && pv<=0.02) return 'warn';
  return 'crit';
}
function waReport(st, day, sum){
  const lab = {ok:'✅ CONFORME', warn:'⚠️ À SURVEILLER', crit:'🔴 ÉCART IMPORTANT'}[sum.statut] || '';
  const ligneMarge = (sum.margeNette!=null) ? `\n📈 Marge nette : *${fmt(sum.margeNette)} F*` : '';
  return `⛽ *TAJI — Rapport du ${frDateShort(day)}*\n📍 ${st.name}\nStatut : *${lab}*\n\n💧 Litres vendus : *${fmt(sum.ventesL)} L*\n🛢 Écart cuves : *${fmtS(sum.ecartCuve)} L*\n💰 CA théorique : ${fmt(sum.caTheo)} F\n💵 Encaissé : ${fmt(sum.enc)} F\n📊 Écart de caisse : *${fmtS(sum.ecartCaisse)} F*${ligneMarge}\n\n_Généré par Taji_`;
}
/* Partage natif (WhatsApp, etc.) avec repli wa.me — idéal en PWA mobile */
async function shareReport(btn){
  const text = decodeURIComponent(btn.dataset.text||'');
  if(navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e && e.name==='AbortError') return; } }
  window.open('https://wa.me/?text='+encodeURIComponent(text), '_blank', 'noopener');
}

/* =====================================================================
   ACCUEIL PROPRIÉTAIRE
===================================================================== */
async function renderAccueil(){
  const day = S.day;
  const sts = myStations();
  $('#main').innerHTML = `<h1 class="pg">Vue d'ensemble</h1>
    <div class="datepick"><input type="date" id="dp" value="${day}" max="${todayISO()}" onchange="S.day=this.value;renderAccueil()">
    <span style="font-size:12px;color:var(--ink3)">${frDate(day)}</span></div>
    <div id="ov_tiles" class="tiles"></div><h2 class="sec">Mes stations</h2><div id="ov_list"><div class="card">Chargement…</div></div>
    <h2 class="sec">Tendance — écart de caisse (14 jours)</h2>
    <div class="card"><div class="legend" id="legend"></div><div class="chartwrap"><svg id="chart" width="100%" height="180"></svg><div id="tip"></div></div>
    <div class="note" style="padding:8px 0 0">Basé sur les journées clôturées. Zéro = caisse conforme aux volumes vendus.</div></div>`;
  if(!sts.length){ $('#ov_list').innerHTML = '<div class="card">Aucune station. Ajoute ta première station dans Réglages.</div>'; return; }
  try{
    const closures = await safe(sb.from('day_closures').select('*')
      .in('station_id', sts.map(s=>s.id)).gte('day', addDays(day,-13)).lte('day', day).eq('status','closed'));
    let vt=0,ecu=0,eca=0,mg=0,mgAny=false,n=0;
    const todayRows = sts.map(st=>{
      const c = closures.find(x=>x.station_id===st.id && x.day===day);
      if(c){ const s=c.summary; vt+=s.ventesL||0; ecu+=s.ecartCuve||0; eca+=s.ecartCaisse||0; if(s.margeNette!=null){mg+=s.margeNette; mgAny=true;} n++; }
      return {st, c};
    });
    $('#ov_tiles').innerHTML = n===0
      ? `<div class="tile" style="grid-column:1/-1"><div class="lbl">EN ATTENTE</div><div style="font-size:12.5px;color:var(--ink2)">Aucune journée clôturée pour cette date. Les chiffres apparaissent dès la clôture par le gérant.</div></div>`
      : `<div class="tile"><div class="lbl">LITRES VENDUS</div><div class="val">${fmt(vt)}</div><div class="unit">litres · ${n}/${sts.length} clôturées</div></div>
         <div class="tile"><div class="lbl">ÉCART CUVES</div><div class="val ${ecu<0?'neg':''}">${fmtS(ecu)}</div><div class="unit">litres</div></div>
         <div class="tile"><div class="lbl">ÉCART CAISSE</div><div class="val ${eca<0?'neg':''}">${fmtS(eca)}</div><div class="unit">FCFA</div></div>
         ${mgAny?`<div class="tile" style="grid-column:1/-1;background:var(--brand-soft);border-color:var(--brand)"><div class="lbl" style="color:var(--brand)">MARGE NETTE</div><div class="val ${mg<0?'neg':'pos'}">${fmt(mg)}</div><div class="unit">FCFA · CA − achats − dépenses</div></div>`:''}`;
    $('#ov_list').innerHTML = todayRows.map(({st,c})=>{
      const s = c?.summary;

            : 'Journée non clôturée'}</div>
          <div style="margin-top:5px">${CHIP[c ? (s.statut||statutOf(s)) : 'wait']}</div>
        </div><div style="color:var(--ink3);font-size:18px">›</div></div></div>`;
    }).join('');
    drawTrend(sts.slice(0,3), closures, day);

}
function drawTrend(sts, closures, day){
  const svg = $('#chart'); if(!svg) return;
  const css = getComputedStyle(document.documentElement);
  const COLS = ['--s1','--s2','--s3'].map(v=>css.getPropertyValue(v).trim());
  const inkM = css.getPropertyValue('--ink3').trim(), baseC = css.getPropertyValue('--baseline').trim(), surf = css.getPropertyValue('--surface').trim();
  const days = Array.from({length:14},(_,i)=>addDays(day,i-13));
  $('#legend').innerHTML = sts.map((st,i)=>`<span class="it"><span class="sw" style="background:${COLS[i]}"></span>${esc(st.name)}</span>`).join('');
  const series = sts.map(st=> days.map(d=>{ const c = closures.find(x=>x.station_id===st.id && x.day===d); return c ? (c.summary.ecartCaisse||0) : null; }));
  const all = series.flat().filter(v=>v!==null);
  const W = svg.clientWidth||400, H=180, mL=8, mR=70, mT=12, mB=20;
  if(!all.length){ svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="12" fill="${inkM}">Pas encore de journées clôturées</text>`; return; }
  const mn=Math.min(...all,0), mx=Math.max(...all,0), pad=(mx-mn)*0.12||1000;
  const y=v=> mT+(H-mT-mB)*(1-(v-(mn-pad))/((mx+pad)-(mn-pad)));
  const x=i=> mL+(W-mL-mR)*i/13;
  let g = `<line x1="${mL}" y1="${y(0)}" x2="${W-mR}" y2="${y(0)}" stroke="${baseC}" stroke-width="1.5"/>
           <text x="${W-mR+6}" y="${y(0)+4}" font-size="10" fill="${inkM}">0 F</text>`;
  [0,4,9,13].forEach(i=> g+=`<text x="${x(i)}" y="${H-4}" font-size="10" fill="${inkM}" text-anchor="middle">${frDateShort(days[i])}</text>`);
  series.forEach((vals,si)=>{
    const pts = vals.map((v,i)=> v===null?null:[x(i),y(v),v,i]).filter(Boolean);
    if(!pts.length) return;
    g += `<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${COLS[si]}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    pts.forEach(p=> g+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${COLS[si]}" stroke="${surf}" stroke-width="2" data-v="${p[2]}" data-s="${si}" data-i="${p[3]}" style="cursor:pointer"/>`);
    const last = pts[pts.length-1];
    g += `<text x="${last[0]+8}" y="${last[1]+4}" font-size="10.5" font-weight="700" fill="${COLS[si]}">${fmtS(last[2])}</text>`;
  });
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML = g;
  const tip = $('#tip');
  svg.querySelectorAll('circle').forEach(c=>{
    const show=()=>{ const r=c.getBoundingClientRect(), w=svg.parentElement.getBoundingClientRect();
      tip.style.left=(r.left-w.left+r.width/2)+'px'; tip.style.top=(r.top-w.top)+'px';
      tip.textContent = sts[+c.dataset.s].name+' · '+frDateShort(days[+c.dataset.i])+' : '+fmtS(+c.dataset.v)+' F'; tip.style.display='block'; };
    c.addEventListener('mouseenter',show); c.addEventListener('click',e=>{e.stopPropagation();show();});
    c.addEventListener('mouseleave',()=>tip.style.display='none');
  });
}

async function showClosure(stId, day){
  try{
    const st = S.stations.find(s=>s.id===stId);

async function reopenDay(stId, day){
  if(!confirm('Rouvrir cette journée ? Le gérant pourra modifier les relevés, puis il faudra re-clôturer.')) return;
  try{
    await safe(sb.from('day_closures').update({status:'reopened'}).eq('station_id',stId).eq('day',day));
    await safe(sb.from('audit_log').insert({station_id:stId, action:'reouverture', entity:'day_closures', entity_id:day, detail:{par:S.profile?.full_name}}));

async function savePompes(stId){
  try{
    const {infra} = S.cache.saisie;
    const rows = [];
    for(const n of infra.nozzles){
      const op = parseFloat($('#op_'+n.id).value), cl = $('#cl_'+n.id).value===''? null : parseFloat($('#cl_'+n.id).value);
      if(isNaN(op) || op<0) return toast('Index ouverture invalide — '+n.name);
      if(cl!==null && cl<op) return toast('⚠ '+n.name+' : fermeture < ouverture');
      if(cl!==null && cl-op > 40000) if(!confirm(`${n.name} : ${fmt(cl-op)} L vendus — c'est inhabituel. Confirmer ?`)) return;
      rows.push({station_id:stId, nozzle_id:n.id, day:S.day, shift_label:'journee',
                 opening_index:op, closing_index:cl, staff_id:$('#stf_'+n.id).value||null, entered_by:S.user.id});
    }
    await safe(sb.from('nozzle_readings').upsert(rows, {onConflict:'nozzle_id,day,shift_label'}));
    toast('✔ Index enregistrés'); renderSaisie();
  }catch(e){ err(e); }
}
async function saveCuves(stId){
  try{
    const {infra} = S.cache.saisie;
    const rows = [];
    for(const t of infra.tanks){
      const v = $('#dip_'+t.id).value;
      if(v==='') continue;
      const d = parseFloat(v);
      if(isNaN(d)||d<0) return toast('Jauge invalide — '+t.name);
      if(d > +t.capacity_l) return toast('⚠ '+t.name+' : jauge > capacité de la cuve');
      rows.push({station_id:stId, tank_id:t.id, day:S.day, dip_l:d, entered_by:S.user.id});
    }
    if(rows.length) await safe(sb.from('tank_dips').upsert(rows, {onConflict:'tank_id,day'}));
    const inv = $('#dl_inv').value;
    if(inv!==''){
      await safe(sb.from('deliveries').insert({station_id:stId, tank_id:$('#dl_tank').value, day:S.day,
        supplier:$('#dl_sup').value.trim(), volume_invoiced_l:parseFloat(inv)||0,
        volume_received_l: $('#dl_rec').value===''? null : parseFloat($('#dl_rec').value), entered_by:S.user.id}));
    }
    toast('✔ Cuves enregistrées'); renderSaisie();
  }catch(e){ err(e); }
}
async function delDelivery(id){ try{ await safe(sb.from('deliveries').delete().eq('id',id)); renderSaisie(); }catch(e){ err(e);} }
async function delCash(id){ try{ await safe(sb.from('cash_entries').delete().eq('id',id)); renderSaisie(); }catch(e){ err(e);} }
async function saveCaisse(stId){
  try{
    const {dayData} = S.cache.saisie;
    for(const m of ['especes','orange_money','moov_money']){
      const v = $('#csh_'+m).value; if(v==='') continue;
      const amt = parseFloat(v)||0;
      const existing = dayData.cash.find(c=>c.method===m && !c.credit_client_id);
      if(existing) await safe(sb.from('cash_entries').update({amount_fcfa:amt}).eq('id',existing.id));
      else await safe(sb.from('cash_entries').insert({station_id:stId, day:S.day, method:m, amount_fcfa:amt, entered_by:S.user.id}));
    }
    toast('✔ Caisse enregistrée'); renderSaisie();
  }catch(e){ err(e); }
}
async function addCreditSale(stId){

    const amt = parseFloat($('#cr_amt').value);
    if(!(amt>0)) return toast('Montant requis');
    await safe(sb.from('cash_entries').insert({station_id:stId, day:S.day, method:'credit',
      amount_fcfa:amt, credit_client_id:$('#cr_client').value, entered_by:S.user.id}));

}

    if(!(amt>0)) return toast('Montant requis');
    await safe(sb.from('expenses').insert({station_id:stId, day:S.day, category:$('#ex_cat').value,
      label:$('#ex_lbl').value.trim(), amount_fcfa:amt, entered_by:S.user.id}));

async function delExpense(id){ try{ await safe(sb.from('expenses').delete().eq('id',id)); renderSaisie(); }catch(e){ err(e);} }
async function doCloture(stId){
  try{
    $('#btn_close').disabled = true;
    const st = S.stations.find(s=>s.id===stId);
    const infra = await loadInfra(stId);
    const dayData = await loadDay(stId, S.day);
    const c = await computeDay(st, S.day, dayData, infra);
    if(!c.complet){ toast('⚠ Il manque des relevés (index de fermeture ou jauges).'); $('#btn_close').disabled=false; return; }
    if(!c.cashOk && !confirm('Aucun encaissement saisi. Clôturer quand même ?')){ $('#btn_close').disabled=false; return; }
    const summary = {ventesL:c.ventesL, caTheo:c.caTheo, enc:c.enc, encParMode:c.encParMode,
      ecartCaisse:c.ecartCaisse, ecartCuve:c.ecartCuve, statut:statutOf(c),
      margeBrute:c.margeBrute, depenses:c.depenses, margeNette:c.margeNette, margeDispo:c.margeDispo,
      lignes:c.lignes.map(l=>({produit:l.produit, ventes:l.ventes, prix:l.prix, prixAchat:l.prixAchat, marge:l.marge, ca:l.ca, ecart:l.ecart, jauge:l.jauge, stockAttendu:l.stockAttendu})),
      parPompiste:c.parPompiste};
    if(dayData.closure && dayData.closure.status==='reopened'){
      await safe(sb.from('day_closures').update({status:'closed', summary, closed_by:S.user.id, closed_at:new Date().toISOString()}).eq('id',dayData.closure.id));
    } else {
      await safe(sb.from('day_closures').insert({station_id:stId, day:S.day, closed_by:S.user.id, summary}));
    }
    await safe(sb.from('audit_log').insert({station_id:stId, action:'cloture', entity:'day_closures', entity_id:S.day,
      detail:{ecartCaisse:c.ecartCaisse, ecartCuve:c.ecartCuve, par:S.profile?.full_name}}));
    toast('✅ Journée clôturée'); renderSaisie();
  }catch(e){ err(e); const b=$('#btn_close'); if(b) b.disabled=false; }
}

async function renderCredits(){

      <div class="bignum ${total>0?'neg':''}">${fmt(total)} F</div>
      <div style="font-size:12px;color:var(--ink3)">montant dû par l'ensemble des clients</div></div>`;

    clients.filter(c=>c.active).forEach(c=>{
      const e = encours(c.id);
      const depasse = +c.plafond_fcfa>0 && e > +c.plafond_fcfa;
      h += `<div class="listrow" style="cursor:pointer" onclick="renderClientDetail('${c.id}')">
        <div><div class="t">${esc(c.name)} ${depasse?'<span class="chip crit" style="font-size:10px">plafond dépassé</span>':''}</div>

    <div class="fld"><label>Plafond de crédit (FCFA, 0 = illimité)</label><input id="nc_plaf" type="number" inputmode="numeric" value="0"></div>

/* =====================================================================

async function renderEquipe(){
  const sts = myStations();
  if(!S.gerStation || !sts.some(s=>s.id===S.gerStation)) S.gerStation = sts[0]?.id;
  const st = sts.find(s=>s.id===S.gerStation);

    <div class="datepick"><select id="eq_st" style="flex:1;padding:9px 10px;font-size:14px;font-weight:600;border:1.5px solid var(--grid);border-radius:10px;background:var(--surface);color:var(--ink1)"
      onchange="S.gerStation=this.value;renderEquipe()">${sts.map(s=>`<option value="${s.id}" ${s.id===S.gerStation?'selected':''}>⛽ ${esc(s.name)}</option>`).join('')}</select></div>

    const moisDebut = S.day.slice(0,8)+'01';

      safe(sb.from('staff').select('*').eq('station_id',st.id).order('created_at')),
      safe(sb.from('nozzle_readings').select('staff_id,opening_index,closing_index').eq('station_id',st.id)

    ]);
    const litres = id => readings.filter(r=>r.staff_id===id).reduce((a,r)=>a+Math.max(0,+r.closing_index - +r.opening_index),0);
    let h = `<h2 class="sec">Pompistes — litres servis ce mois</h2><div class="card">`;
    if(!staff.length) h += `<p style="font-size:13px;color:var(--ink3)">Aucun pompiste enregistré. Ajoute ton équipe ci-dessous, puis associe un pompiste à chaque pistolet dans la Saisie du jour.</p>`;
    staff.filter(p=>p.active).forEach(p=>{
      h += `<div class="listrow"><div><div class="t">${esc(p.full_name)}</div><div class="m">${esc(p.phone||'')} · ${p.role}</div></div>
        <div style="text-align:right"><b>${fmt(litres(p.id))} L</b>
        <div class="m"><button class="link" style="color:var(--crit);font-size:11px" onclick="toggleStaff('${p.id}',false)">désactiver</button></div></div></div>`;
    });
    const inactifs = staff.filter(p=>!p.active);
    if(inactifs.length) h += inactifs.map(p=>`<div class="listrow" style="opacity:.5"><div class="t">${esc(p.full_name)} (inactif)</div>
      <button class="link" onclick="toggleStaff('${p.id}',true)">réactiver</button></div>`).join('');
    h += `</div>
    <h2 class="sec">Ajouter un membre</h2>
    <div class="card"><div class="grid2">
      <div class="fld"><label>Nom complet</label><input id="sf_name" placeholder="Prénom Nom"></div>
      <div class="fld"><label>Téléphone</label><input id="sf_phone" type="tel" placeholder="+223 …"></div>
    </div>
    <div class="fld"><label>Rôle</label><select id="sf_role"><option value="pompiste">Pompiste</option><option value="caissier">Caissier</option><option value="autre">Autre</option></select></div>
    <button class="btn" onclick="addStaff('${st.id}')">+ Ajouter</button></div>
    <div class="note">Astuce : en associant un pompiste à chaque pistolet lors de la saisie, les litres servis (et les écarts) deviennent traçables par personne.</div>`;
    $('#eq_body').innerHTML = h;

   RAPPORTS & EXPORTS (propriétaire)
===================================================================== */
async function renderRapports(){
  const sts = myStations();
  const mois = S.moisRapport || todayISO().slice(0,7);
  $('#main').innerHTML = `<h1 class="pg">Rapports</h1>
    <div class="datepick"><input type="month" id="rp_mois" value="${mois}" max="${todayISO().slice(0,7)}"
      onchange="S.moisRapport=this.value;renderRapports()"></div>
    <div id="rp_body"><div class="card">Chargement…</div></div>`;
  if(!sts.length){ $('#rp_body').innerHTML='<div class="card">Aucune station.</div>'; return; }
  try{
    const d1 = mois+'-01', d2 = mois+'-31';
    const closures = await safe(sb.from('day_closures').select('*').in('station_id',sts.map(s=>s.id))
      .gte('day',d1).lte('day',d2).eq('status','closed').order('day'));
    let h='';
    let T={v:0,ca:0,enc:0,ec:0,cu:0,mg:0}; let mgAny=false;
    h += `<div class="card"><table class="rec"><tr><th>Station</th><th>Jours</th><th>Litres</th><th>Écart caisse</th></tr>`;
    sts.forEach(st=>{
      const cs = closures.filter(c=>c.station_id===st.id);
      const v = cs.reduce((a,c)=>a+(c.summary.ventesL||0),0);
      const ca = cs.reduce((a,c)=>a+(c.summary.caTheo||0),0);
      const enc = cs.reduce((a,c)=>a+(c.summary.enc||0),0);
      const ec = cs.reduce((a,c)=>a+(c.summary.ecartCaisse||0),0);
      const cu = cs.reduce((a,c)=>a+(c.summary.ecartCuve||0),0);
      const mg = cs.reduce((a,c)=>a+(c.summary.margeNette||0),0);
      if(cs.some(c=>c.summary.margeNette!=null)) mgAny=true;
      T.v+=v;T.ca+=ca;T.enc+=enc;T.ec+=ec;T.cu+=cu;T.mg+=mg;
      h += `<tr><td>${esc(st.name)}</td><td>${cs.length}</td><td>${fmt(v)} L</td><td class="${ec<0?'neg':''}">${fmtS(ec)} F</td></tr>`;
    });
    h += `<tr><td><b>Total</b></td><td></td><td><b>${fmt(T.v)} L</b></td><td class="${T.ec<0?'neg':''}"><b>${fmtS(T.ec)} F</b></td></tr></table></div>`;
    h += `<div class="tiles">
      <div class="tile"><div class="lbl">CA THÉORIQUE</div><div class="val">${fmt(T.ca/1000000)}</div><div class="unit">millions F</div></div>
      <div class="tile"><div class="lbl">ENCAISSÉ</div><div class="val">${fmt(T.enc/1000000)}</div><div class="unit">millions F</div></div>

      ${mgAny?`<div class="tile" style="grid-column:1/-1;background:var(--brand-soft);border-color:var(--brand)"><div class="lbl" style="color:var(--brand)">MARGE NETTE DU MOIS</div><div class="val ${T.mg<0?'neg':'pos'}">${fmt(T.mg)}</div><div class="unit">FCFA</div></div>`:''}

    <h2 class="sec">Exports (pour le comptable)</h2>
    <div class="card">
      <button class="btn ghost" onclick="exportClosuresCSV('${mois}')">⬇ Synthèses quotidiennes (CSV)</button>

    </div>`;
    $('#rp_body').innerHTML = h;
    S.cache.rapport = {closures, mois};
  }catch(e){ err(e); }
}
function dlCSV(name, rows){
  const csv = rows.map(r=>r.map(v=>{ v = v==null?'':String(v); return /[";\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }).join(';')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}
function exportClosuresCSV(mois){
  const {closures} = S.cache.rapport;
  const rows = [['Date','Station','Litres vendus','CA théorique (F)','Encaissé (F)','Écart caisse (F)','Écart cuves (L)','Marge brute (F)','Dépenses (F)','Marge nette (F)','Statut']];
  closures.forEach(c=>{
    const st = S.stations.find(s=>s.id===c.station_id); const s=c.summary;
    rows.push([c.day, st?.name, Math.round(s.ventesL||0), Math.round(s.caTheo||0),
      Math.round(s.enc||0), Math.round(s.ecartCaisse||0), Math.round(s.ecartCuve||0),
      s.margeBrute!=null?Math.round(s.margeBrute):'', s.depenses!=null?Math.round(s.depenses):'', s.margeNette!=null?Math.round(s.margeNette):'', s.statut]);
  });
  dlCSV(`taji_syntheses_${mois}.csv`, rows);
}
async function exportDetailCSV(mois){
  try{
    const sts = myStations(); const d1 = mois+'-01', d2 = mois+'-31';
    const [reads, cash] = await Promise.all([
      safe(sb.from('nozzle_readings').select('*, nozzles(name)').in('station_id',sts.map(s=>s.id)).gte('day',d1).lte('day',d2).order('day')),
      safe(sb.from('cash_entries').select('*').in('station_id',sts.map(s=>s.id)).gte('day',d1).lte('day',d2).order('day'))
    ]);
    const rows = [['Type','Date','Station','Détail','Ouverture','Fermeture','Litres','Mode','Montant (F)']];
    reads.forEach(r=>{
      const st = S.stations.find(s=>s.id===r.station_id);
      rows.push(['Relevé pompe', r.day, st?.name, r.nozzles?.name, r.opening_index, r.closing_index,
        r.closing_index!=null? Math.round(r.closing_index-r.opening_index):'', '', '']);
    });
    cash.forEach(c=>{
      const st = S.stations.find(s=>s.id===c.station_id);
      rows.push(['Encaissement', c.day, st?.name, '', '', '', '', c.method, Math.round(c.amount_fcfa)]);
    });
    dlCSV(`taji_detail_${mois}.csv`, rows);
  }catch(e){ err(e); }
}

/* =====================================================================
   RÉGLAGES
===================================================================== */
async function renderReglages(){
  const sts = myStations();
  let h = `<h1 class="pg">Réglages</h1><div class="sub">${esc(S.profile?.full_name||'')} — ${S.isOwner?'Propriétaire':'Gérant'}</div>`;

    <div class="grid2">
      <div class="fld"><label>Nom complet</label><input id="pf_name" value="${esc(S.profile?.full_name||'')}"></div>
      <div class="fld"><label>Téléphone</label><input id="pf_phone" value="${esc(S.profile?.phone||'')}"></div>
    </div>
    <button class="btn ghost small" onclick="saveProfile()">Enregistrer</button></div>`;
  if(S.isOwner){
    const org = S.orgs.find(o=>o.owner_id===S.user.id);
    h += `<h2 class="sec">Prix vente / achat (FCFA / L)</h2><div class="card" id="rg_prices">`;
    const inpStyle = 'width:78px;padding:8px;border:1.5px solid var(--grid);border-radius:8px;background:var(--page);color:var(--ink1);font-size:15px';
    for(const p of Object.keys(PRODUITS)){
      const cur = latestPrice(org.id, p);
      const curBuy = latestBuyPrice(org.id, p);
      if(cur===null && !['essence','gasoil'].includes(p)) continue;
      h += `<div class="listrow"><div class="t">${PRODUITS[p]}</div>
        <div style="display:flex;gap:8px;align-items:flex-end">
          <div style="text-align:center"><div style="font-size:9.5px;color:var(--ink3);font-weight:700;margin-bottom:2px">VENTE</div>
            <input type="number" inputmode="numeric" id="px_${p}" value="${cur??''}" placeholder="—" style="${inpStyle}"></div>
          <div style="text-align:center"><div style="font-size:9.5px;color:var(--ink3);font-weight:700;margin-bottom:2px">ACHAT</div>
            <input type="number" inputmode="numeric" id="buy_${p}" value="${curBuy??''}" placeholder="—" style="${inpStyle}"></div>
        </div></div>`;
    }
    h += `<button class="btn ghost small" onclick="savePrices('${org.id}')">Mettre à jour les prix</button>
      <div class="hint" style="margin-top:6px;color:var(--ink3);font-size:11px">Le prix d'achat sert au calcul de la marge nette. Chaque changement est historisé : les rapports passés gardent l'ancien prix.</div></div>`;
    h += `<h2 class="sec">Mes stations</h2>`;
    sts.forEach(st=>{ h += `<div class="card"><div class="rowline" style="cursor:pointer" onclick="renderStationConfig('${st.id}')">
      <div><div style="font-weight:700">${esc(st.name)}</div><div style="font-size:12px;color:var(--ink3)">${esc(st.city)} — cuves, pistolets, invitations</div></div>
      <div style="color:var(--ink3)">›</div></div></div>`; });
    h += `<div class="card"><b style="font-size:13.5px">Nouvelle station</b>
      <div class="grid2" style="margin-top:8px">
        <div class="fld"><label>Nom</label><input id="ns_name" placeholder="Station …"></div>
        <div class="fld"><label>Ville / quartier</label><input id="ns_city"></div>
      </div><button class="btn ghost small" onclick="addStation('${org.id}')">+ Ajouter la station</button></div>`;
  }
  h += `<div class="card" style="margin-top:20px"><button class="btn danger" onclick="doLogout()">Se déconnecter</button></div>
    <div class="note">Taji v1.0 — vos données sont sauvegardées en ligne et sécurisées par compte.<br>Chaque action sensible est tracée dans le journal d'audit.</div>`;
  $('#main').innerHTML = h;
}
async function saveProfile(){
  try{
    await safe(sb.from('profiles').upsert({id:S.user.id, full_name:$('#pf_name').value.trim(), phone:$('#pf_phone').value.trim()}));
    S.profile = {...S.profile, full_name:$('#pf_name').value.trim(), phone:$('#pf_phone').value.trim()};
    toast('✔ Profil enregistré'); renderApp();
  }catch(e){ err(e); }
}
async function savePrices(orgId){
  try{
    const rows=[];
    for(const p of Object.keys(PRODUITS)){
      const el = document.getElementById('px_'+p); if(!el) continue;
      const elBuy = document.getElementById('buy_'+p);
      const curSale = latestPrice(orgId,p), curBuy = latestBuyPrice(orgId,p);
      const saleChanged = el.value!=='' && parseFloat(el.value)!==curSale;
      const buyChanged  = elBuy && elBuy.value!=='' && parseFloat(elBuy.value)!==curBuy;
      if(!(saleChanged || buyChanged)) continue;
      const vSale = el.value===''? curSale : parseFloat(el.value);
      const vBuy  = (!elBuy || elBuy.value==='')? curBuy : parseFloat(elBuy.value);
      if(!(vSale>0)){ toast('Prix de vente requis — '+PRODUITS[p]); continue; }
      rows.push({org_id:orgId, product:p, price_fcfa:vSale, buy_price_fcfa:(vBuy!=null && vBuy>=0)? vBuy : null, created_by:S.user.id});
    }
    if(!rows.length) return toast('Aucun changement');
    await safe(sb.from('prices').insert(rows));
    S.prices = await safe(sb.from('prices').select('*'));
    toast('✔ Prix mis à jour'); renderReglages();
  }catch(e){ err(e); }
}
async function addStation(orgId){
  try{
    const name = $('#ns_name').value.trim(); if(!name) return toast('Nom requis');
    await safe(sb.from('stations').insert({org_id:orgId, name, city:$('#ns_city').value.trim()}));
    await loadContext(); toast('✔ Station créée — configure ses cuves et pistolets'); renderReglages();
  }catch(e){ err(e); }
}
async function renderStationConfig(stId){
  const st = S.stations.find(s=>s.id===stId);
  delete S.cache['infra_'+stId];
  $('#main').innerHTML = `<button class="back" onclick="renderReglages()">‹ Réglages</button>
    <h1 class="pg">${esc(st.name)}</h1><div class="sub">${esc(st.city)}</div><div id="sc_body"><div class="card">Chargement…</div></div>`;
  try{
    const infra = await loadInfra(stId);
    const invites = await safe(sb.from('invites').select('*').eq('station_id',stId).order('created_at',{ascending:false}));
    const members = await safe(sb.from('station_members').select('*, profiles:user_id(full_name)').eq('station_id',stId));
    let h = `<h2 class="sec">Cuves</h2><div class="card">`;
    infra.tanks.forEach(t=>{ h += `<div class="listrow"><div><div class="t">🛢 ${esc(t.name)}</div>
      <div class="m">${PRODUITS[t.product]} · capacité ${fmt(t.capacity_l)} L</div></div></div>`; });
    h += `<div class="grid2" style="margin-top:8px">
      <div class="fld"><label>Produit</label><select id="nt_p"><option value="essence">Essence</option><option value="gasoil">Gasoil</option><option value="petrole">Pétrole</option><option value="melange">Mélange</option></select></div>
      <div class="fld"><label>Nom</label><input id="nt_n" placeholder="Cuve …"></div>
      <div class="fld"><label>Capacité (L)</label><input id="nt_c" type="number" inputmode="numeric"></div>
      <div class="fld"><label>Stock actuel (L)</label><input id="nt_s" type="number" inputmode="numeric"></div>
    </div><button class="btn ghost small" onclick="cfgAddTank('${stId}')">+ Ajouter une cuve</button></div>`;
    h += `<h2 class="sec">Pistolets</h2><div class="card">`;
    infra.nozzles.forEach(n=>{ const t=infra.tanks.find(x=>x.id===n.tank_id);
      h += `<div class="listrow"><div><div class="t">⛽ ${esc(n.name)}</div><div class="m">${esc(t?.name||'')} · index initial ${fmt(n.initial_index)}</div></div></div>`; });
    h += infra.tanks.length? `<div class="grid2" style="margin-top:8px">
      <div class="fld"><label>Cuve</label><select id="nn_t">${infra.tanks.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>
      <div class="fld"><label>Nom</label><input id="nn_n" placeholder="Pompe 1 · Pistolet A"></div>
    </div>
    <div class="fld"><label>Index actuel du compteur</label><input id="nn_i" type="number" inputmode="numeric"></div>
    <button class="btn ghost small" onclick="cfgAddNozzle('${stId}')">+ Ajouter un pistolet</button>` : '';
    h += `</div>`;
    h += `<h2 class="sec">Gérants de cette station</h2><div class="card">`;
    members.filter(m=>m.active).forEach(m=>{ h += `<div class="listrow"><div class="t">🧑‍🔧 ${esc(m.profiles?.full_name||'—')}</div>
      <button class="link" style="color:var(--crit)" onclick="revokeMember('${m.id}','${stId}')">révoquer</button></div>`; });
    if(!members.filter(m=>m.active).length) h += `<p style="font-size:13px;color:var(--ink3)">Aucun gérant rattaché pour l'instant.</p>`;
    h += `<button class="btn ghost small" style="margin-top:8px" onclick="makeInvite('${st.org_id}','${stId}')">+ Générer un code d'invitation gérant</button>`;
    const pending = invites.filter(i=>!i.used_by);
    if(pending.length) h += pending.map(i=>`<div class="codebox">${esc(i.code)}</div>
      <div style="font-size:12px;color:var(--ink3);text-align:center;margin-top:-4px">À transmettre au gérant — il crée son compte puis saisit ce code.</div>`).join('');
    h += `</div>`;
    $('#sc_body').innerHTML = h;
  }catch(e){ err(e); }
}
async function cfgAddTank(stId){
  try{
    const cap = +$('#nt_c').value; if(!(cap>0)) return toast('Capacité requise');
    await safe(sb.from('tanks').insert({station_id:stId, product:$('#nt_p').value, name:$('#nt_n').value.trim()||'Cuve',
      capacity_l:cap, initial_stock_l:+$('#nt_s').value||0}));
    toast('✔ Cuve ajoutée'); renderStationConfig(stId);
  }catch(e){ err(e); }
}
async function cfgAddNozzle(stId){
  try{
    await safe(sb.from('nozzles').insert({station_id:stId, tank_id:$('#nn_t').value,
      name:$('#nn_n').value.trim()||'Pistolet', initial_index:+$('#nn_i').value||0}));
    toast('✔ Pistolet ajouté'); renderStationConfig(stId);
  }catch(e){ err(e); }
}
async function makeInvite(orgId, stId){
  try{
    const code = 'TJ' + Math.random().toString(36).slice(2,6).toUpperCase();
    await safe(sb.from('invites').insert({code, org_id:orgId, station_id:stId, role:'gerant'}));
    toast('✔ Code généré'); renderStationConfig(stId);
  }catch(e){ err(e); }
}
async function revokeMember(mid, stId){
  if(!confirm('Révoquer l\'accès de ce gérant ?')) return;
  try{ await safe(sb.from('station_members').update({active:false}).eq('id',mid)); toast('Accès révoqué'); renderStationConfig(stId); }catch(e){ err(e); }
}

/* démarrage */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW non enregistré', e)); });
}
try { TajiOffline.init(); } catch (e) { console.warn('Offline init', e); }
boot();
</script>
</body>
</html>
